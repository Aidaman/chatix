<div class="room-list-wrapper" *ngIf="theme | async as theme"
     [ngClass]="{'dark': theme === 'dark', 'light': theme === 'light'}">
  <div class="list-title">
    <p>Main menu</p>
    <button mat-button matRipple (click)="closeList()">
      <mat-icon>arrow_back_ios</mat-icon>
    </button>
  </div>

  <div class="search-rooms">
    <app-theming></app-theming>
    <div class="add-btn" (click)="createRoom()" matRipple>
      <mat-icon>add</mat-icon>
      <span>Create new room</span>
    </div>

    <input matInput
           placeholder="Search room..."
           (input)="searchRooms()"
           [(ngModel)]="searchText">
        <mat-slide-toggle class="searchToggle"
                          (change)="toggleSearch()">
          {{isPublicRooms ? 'Globally' : 'Locally'}}
        </mat-slide-toggle>
<!--    <mat-button-toggle-group name="roomCategories" aria-label="Room Categories">-->
<!--      <mat-button-toggle value="Admin">Admin</mat-button-toggle>-->
<!--      <mat-button-toggle value="Private">Private</mat-button-toggle>-->
<!--      <mat-button-toggle value="Public">Public</mat-button-toggle>-->
<!--    </mat-button-toggle-group>-->
  </div>
  <div class="room-list">
    <mat-list>
      <mat-list-item class="room-list-item"
                     *ngFor="let room of rooms | search: searchText"
                     (click)="navigateRoom(room._id)">
        <mat-divider></mat-divider>
        <!--        <div class="unread" *ngIf="unread[room._id] > 0"><span>{{unread[room._id]}}</span></div>-->
        <div class="room-title-wrapper">
          <span class="room-title">{{room.title}}</span>
          <small *ngIf="room._id !== 'common'">Last action: {{room.lastAction | date: 'HH:mm:ss - dd.MM.yy'}}</small>
        </div>
      </mat-list-item>
    </mat-list>
  </div>
</div>
