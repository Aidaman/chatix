<div class="dialog-wrapper">
  <div class="dialog-content-wrapper">
    <h1 mat-dialog-title>Invitations to {{room.title}}</h1>

    <form [formGroup]="addUsersForm">
      <div class="part-wrapper">
        <h2 mat-dialog-title>Add users below</h2>
        <button type="button" mat-button (click)="addParticipant()">
          <i class="material-icons">add</i>
        </button>
      </div>

      <div class="user-list" formArrayName="participants">
        <div class="list-items" *ngFor="let item of participants.controls; let pointIndex=index" [formGroupName]="pointIndex.toString()">
          <mat-form-field class="part-input">
            <label>
              <input matInput [placeholder]="'Participant - ' + (pointIndex + 1)"
                     formControlName="name"
                     (click)="selectedInput = pointIndex"
                     [matAutocomplete]="auto">
            </label>
            <mat-autocomplete #auto="matAutocomplete">
              <mat-option *ngFor="let state of searchedUsers"
                          [value]="state.name"
                          (click)="pushId(state._id)">
                <img [src]="state.avatar" alt="" height="23">
                <span>{{state.name}}</span>
              </mat-option>
            </mat-autocomplete>
          </mat-form-field>
          <mat-icon *ngIf="userIds[pointIndex]" class="done">done</mat-icon>
          <button type="button" class="delete-btn" mat-button (click)="deleteParticipant(pointIndex)">
            <i class="material-icons">delete</i>
          </button>
        </div>
      </div>
    </form>

    <div mat-dialog-actions>
      <button mat-button class="close-btn" (click)="onNoClick()">
        <i class="material-icons">clear</i>
      </button>
      <button mat-button (click)="onInvite()" class="create-btn" [disabled]="!addUsersForm.valid
                || addUsersForm.untouched
                || !validateInputs()
                || participants.length < 1">Invite
      </button>
    </div>
  </div>
</div>
